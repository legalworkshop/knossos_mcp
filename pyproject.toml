[project]
name = "knossos-mcp"
version = "0.1.0"
description = "Knossos — MCP server for remote LAN filesystem + CLI access between machines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Knossos contributors" }]
dependencies = [
  "fastmcp>=2.3.0",
  "python-dotenv>=1.0.0",
  "psutil>=5.9.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
knossos = "knossos.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knossos"]
